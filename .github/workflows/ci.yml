name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  placeholder:
    name: Placeholder CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm project scaffold exists
        run: |
          echo "Checking initial project scaffold..."
          test -f README.md
          test -f PLAN.md
          test -d backend
          test -d frontend
          echo "Initial scaffold check passed."